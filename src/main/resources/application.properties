spring.application.name=ai-whatif-lab
server.port=${SERVER_PORT:8088}

# ===========================================================================
# 数据源
# ===========================================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:whatif_lab}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
# 批量导入 Entity/Event 时用 HikariCP 的批处理能力，连接数按「导入任务串行 + 仿真读连接池」估
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=2

# ===========================================================================
# MyBatis-Plus
# ===========================================================================
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-plus.global-config.db-config.id-type=auto

# ===========================================================================
# Redis（结果缓存 / 分布式锁 / SingleFlight / 任务状态）
#
# 【为什么用 db 5】本机 Redis 上还有别的项目在用（二手市场用 db 3），
# 统一加 whatif: 前缀 + 独立 db，避免 key 串味。
# 【缓存的是「计算结果」而不是「查询结果」】仿真是 CPU 密集型长任务，
# 同一个 (dataset + model + rule + scenario + seed + simCount) 组合算一次就够了，
# 这是本项目缓存收益最大的地方 —— 见 CacheKeys。
# ===========================================================================
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DB:5}
spring.data.redis.timeout=3s

# 领域配置目录（**jar 之外**）：丢一份 *.json 进去 + 重启 = 新增一个领域，
# 不用改代码、不用重新打包 —— 这是「换领域不改代码」的落点。
# 内置样例在 classpath:domains/*.json（随 jar 分发）；同名时外部目录覆盖内置。
whatif.domains.dir=${WHATIF_DOMAINS_DIR:domains}

whatif.cache.enabled=${WHATIF_CACHE_ENABLED:true}
# 结果缓存 TTL（秒）。默认 1 天：数据集/模型/规则变了 key 就会变，靠 TTL 只是兜底清理。
whatif.cache.result-ttl-seconds=86400
# 未抢到重建锁时，等待并重试读缓存的上限（毫秒）。
# 击穿防护的目标是「把 N 次并发压成 1 次计算」，不是「保证谁都不算」：
# 超时后降级为各自计算，比让请求为一个锁阻塞几秒更好。
whatif.cache.rebuild-wait-millis=800
# 分布式锁 TTL（秒）。仿真最长可能跑几十秒，锁要覆盖住；同时必须有 TTL 防止宕机后死锁。
whatif.cache.lock-ttl-seconds=120

# ===========================================================================
# 仿真引擎默认参数
#
# 【这些数字都是「算力/精度」的显式取舍，不是拍脑袋】
#   simulations       : 蒙特卡洛重复次数。越大 P5/P95 越稳，成本线性上升。
#   active-customers  : 每次仿真抽样的活跃客户数。数据集中有 5800+ 客户，
#                       全量 × 1000 次会让实验跑几分钟，抽样是有意为之。
#   candidates-per-customer : 每个客户每次「逛店」考虑的商品数（隐式反馈的负采样口径，
#                       训练与推理必须用同一套采样逻辑，否则模型会系统性偏移）。
#   session-interval-days   : 客户平均多少天逛一次店 → 决定 duration 天数内的会话数。
#   gross-margin      : 毛利率假设。利润 = 收入 - 成本，成本 = 原价 × (1 - 毛利率)。
#                       这是**假设值**，不是从数据里学出来的（UCI 数据没有成本列），
#                       所以它必须是可配置的、并且要能一键换掉做敏感性分析。
# ===========================================================================
whatif.simulation.default-simulations=200
whatif.simulation.max-simulations=2000
whatif.simulation.default-duration-days=30
whatif.simulation.active-customers=1000
whatif.simulation.max-active-customers=20000
whatif.simulation.candidates-per-customer=8
whatif.simulation.session-interval-days=7
whatif.simulation.gross-margin=0.35
# 训练集负采样比例（1 个正样本配 N 个负样本）
whatif.simulation.negative-ratio=4
# 仿真线程数（每个仿真的内层循环用并行流）
whatif.simulation.parallelism=0

# ===========================================================================
# 任务调度模式：local（进程内线程池）/ kafka（Kafka 消费者）
#
# 【为什么默认 local】本机 Docker 未启动，没有 broker。默认 local 保证项目
# 开箱即跑；kafka 模式与 local 模式共用同一套「状态机 + 幂等 + 重试」代码，
# 差异只在「谁来触发执行」这一层（见 ExperimentDispatch SPI）。
# ===========================================================================
whatif.dispatch.mode=${WHATIF_DISPATCH_MODE:local}
whatif.dispatch.threads=2
# 单个实验的最大执行时间（秒）。超时判定为失败，避免 worker 被一个病态实验占死。
whatif.dispatch.timeout-seconds=300
whatif.dispatch.max-retry=3

spring.kafka.bootstrap-servers=${KAFKA_SERVERS:127.0.0.1:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=whatif-lab-simulation
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
whatif.kafka.topic=whatif-experiment

# ===========================================================================
# SSE 推送
# ===========================================================================
spring.mvc.async.request-timeout=600000

# ===========================================================================
# AI（Spring AI Alibaba / 通义千问）
#
# 【必须先看这段：为什么把 DashScope 的自动配置全部排除】
# 引入 spring-ai-alibaba-starter-dashscope 后，DashScope 的自动配置会无条件创建一批 bean，
# 其中 DashScopeAgentAutoConfiguration 缺少 api-key 时直接抛：
#     IllegalArgumentException: DashScope API key must be set.
# 它抛在容器 refresh 阶段 → 结果不是「AI 不可用」，而是**整个应用启动失败**。
# 一个可选增值功能把整站拖死，是绝对不能接受的故障模式。
# 所以这里把 10 个 DashScope 自动配置全部排除（与 jar 内 AutoConfiguration.imports 逐行核对过），
# 改由 com.whatif.lab.ai.config.AiModelConfig 手工装配 ChatModel，
# 用 @ConditionalOnExpression 保证「没配 key 就不建 bean，应用照常启动」。
# ===========================================================================
spring.autoconfigure.exclude=\
  com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration,\
  com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration,\
  com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration,\
  com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeVideoAutoConfiguration,\
  com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration,\
  com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration,\
  com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration,\
  com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration,\
  com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeMultimodalEmbeddingAutoConfiguration,\
  com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAsyncToolCallingManagerAutoConfiguration

# 总开关。置 false 可完全关掉 AI（验证降级路径、线上止血用），不需要删 key。
whatif.ai.enabled=${WHATIF_AI_ENABLED:true}
# ==================== 模型供应商（可切换，AI 始终是可选项） ====================
# dashscope（默认，阿里云百炼）| deepseek | openai | 任意 OpenAI 兼容供应商名（需配 base-url）
#   换供应商只改这两三个变量，业务代码与 Agent 一行都不用动 —— 它们只依赖 Spring AI 的 ChatModel 接口。
#   例（DeepSeek）：  WHATIF_AI_PROVIDER=deepseek  WHATIF_AI_API_KEY=sk-xxx
#   例（月之暗面）：  WHATIF_AI_PROVIDER=moonshot  WHATIF_AI_BASE_URL=https://api.moonshot.cn WHATIF_AI_MODEL=moonshot-v1-8k WHATIF_AI_API_KEY=sk-xxx
#   例（本地 Ollama）：WHATIF_AI_PROVIDER=ollama  WHATIF_AI_BASE_URL=http://127.0.0.1:11434 WHATIF_AI_MODEL=qwen2.5:7b WHATIF_AI_API_KEY=ollama
whatif.ai.provider=${WHATIF_AI_PROVIDER:dashscope}
# API Key：按供应商填一个即可（优先级从左到右，前两个是通用的，后两个是历史兼容）。
# 留空 = AI 不可用，但应用必须照常启动（这是刻意的，见 AiModelConfig 的注释）。
whatif.ai.api-key=${WHATIF_AI_API_KEY:${AI_API_KEY:${AI_DASHSCOPE_API_KEY:${ALIQWEN-API:}}}}
# OpenAI 兼容端点的 base-url：填**服务根地址**，不要带 /v1（客户端会自己补 /v1/chat/completions）。
# deepseek / openai 有内置默认地址，可留空；其它供应商必须显式给。
whatif.ai.base-url=${WHATIF_AI_BASE_URL:}
# 模型名：dashscope 下 qwen-plus 是质量/成本/速度的平衡点；换供应商时若仍是 qwen-plus，会按供应商自动替换
# （deepseek→deepseek-chat，openai→gpt-4o-mini），避免出现"模型名没改 → 上游报 model not found"这种排查成本很高的错。
whatif.ai.model=${WHATIF_AI_MODEL:qwen-plus}
# 单次 Agent 调用超时（毫秒）。LLM 首字延迟常见 1~3s，必须有值，否则挂起的上游会拖满 Tomcat 线程池。
whatif.ai.timeout-millis=60000
# ReAct 循环上限：每多一轮 = 一次真实 token 计费 + 一次上游请求，必须设硬闸。
whatif.ai.max-iterations=8
# Agent 专用线程池大小。刻意做小：AI 排队/超时，主链路（仿真、查询）必须保持快。
whatif.ai.threads=4
# AI 调用排队上限，超过直接拒绝（快速失败，不堆积）。
whatif.ai.queue-capacity=32

# ===========================================================================
# 导入
# ===========================================================================
whatif.import.batch-size=2000
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=300MB

logging.level.root=INFO
logging.level.com.whatif.lab=INFO
logging.level.org.springframework.ai=INFO
